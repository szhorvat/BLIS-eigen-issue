name: CI

on:
  push:
  pull_request:

jobs:
  eigen-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BLAS and LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblapack-dev
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Run eigenvalue example
        run: ./build/eigen_example
